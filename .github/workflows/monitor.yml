name: Published site health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/smoke.mjs https://harshitsaini0133.github.io/Harshit_saini_portfolio/
