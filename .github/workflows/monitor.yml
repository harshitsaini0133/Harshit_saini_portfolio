name: Published site health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/smoke.mjs https://harshitsaini0133.github.io/Harshit_saini_portfolio/
