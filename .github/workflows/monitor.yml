name: Published site health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/smoke.mjs https://harshitsaini0133.github.io/Harshit_saini_portfolio/
